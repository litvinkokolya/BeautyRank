version: "3"

services:
  database:
    image: postgres:15
    expose:
      - 5432
    volumes:
      - database:/var/lib/postgresql/data/
    env_file:
      - backend/.env
    restart: always
  backend: &django
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    command: gunicorn --access-logfile /var/log/gunicorn/access.log --error-logfile /var/log/gunicorn/error.log --log-level debug --capture-output --bind 0.0.0.0:8000 -w 2 RateOnline.wsgi
    depends_on:
      - database
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - backend/.env
    volumes:
      - /var/log/gunicorn:/var/log/gunicorn
  celery:
    ports: [ ]
    container_name: celery
    build: ./backend
    <<: *django
    restart: always
    depends_on:
      - redis
    command: "celery -A RateOnline worker --loglevel=info"
  redis:
    container_name: redis
    restart: always
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/var/lib/redis/data/
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    command: yarn start
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    restart: always


volumes:
  database:
  redis:
